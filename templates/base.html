{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Экскурсионное бюро{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="brand" href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt=""
                    class="site-logo"
                >
                <span class="brand__name">Экскурсионное бюро</span>
            </a>

            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">
            <span>© <span id="current-year"></span> Экскурсионное бюро</span>
            <span>Гиды, маршруты, экскурсии и расписание</span>
        </div>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
