{% comment %}
Статус занятия: используется в таблице занятий и в карточке занятия,
поэтому вынесен в отдельный включаемый шаблон.
{% endcomment %}
{% if schedule.status == "отменена" %}
    <span class="badge badge--danger status-badge">отменена</span>
{% elif schedule.status == "проведена" %}
    <span class="badge badge--off status-badge">проведена</span>
{% else %}
    <span class="badge badge--ok status-badge">запланирована</span>
{% endif %}
