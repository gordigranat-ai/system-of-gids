{% extends "base.html" %}

{% block title %}Гиды – экскурсионное бюро{% endblock %}

{% block content %}
    <div class="page-head">
        <div>
            <h1>Гиды</h1>
            <p class="page-head__hint">Всего в справочнике: {{ guides|length }}</p>
        </div>

        <a href="{% url 'guides:available' %}" class="button button--outline">
            Свободные на дату
        </a>
    </div>

    {% for guide in guides %}
        {% include "guides/includes/guide_card.html" %}
    {% empty %}
        <div class="empty">Гидов пока нет.</div>
    {% endfor %}
{% endblock %}
