{% extends "base.html" %}

{% block title %}Маршруты – экскурсионное бюро{% endblock %}

{% block content %}
    <div class="page-head">
        <div>
            <h1>Маршруты</h1>
            <p class="page-head__hint">Всего маршрутов: {{ routes|length }}</p>
        </div>
    </div>

    <div class="cards">
        {% for route in routes %}
            {% include "routes/includes/route_card.html" %}
        {% empty %}
            <div class="empty">Маршрутов пока нет.</div>
        {% endfor %}
    </div>
{% endblock %}
